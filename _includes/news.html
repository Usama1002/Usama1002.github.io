<aside class="news" aria-labelledby="news-heading">
  <h2 id="news-heading" class="news__title">News</h2>
  <ul class="news__list">
    {% for item in site.data.news %}
    <li class="news__item">
      <span class="news__date">{{ item.date }}</span>
      <span class="news__text">{{ item.text | markdownify | remove: '<p>' | remove: '</p>' | strip }}</span>
    </li>
    {% endfor %}
  </ul>
</aside>
